name: Bazel

on:
  pull_request:
  push:
    branches: [main, "release_*"]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true
      - name: Check Bazel formatting
        run: bazel run @buildifier_prebuilt//:buildifier -- -mode=check -lint=warn -r .
      - name: Check release packaging
        run: python3 tools/test_bazel_release.py

  consumer:
    name: ${{ matrix.os }} / Bazel ${{ matrix.bazel }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15-intel, macos-15, windows-latest]
        bazel: [7.x, 8.x, 9.x]
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.bazel }}
          repository-cache: true
      - name: Test libraries and regressions
        run: bazel test --test_output=errors //...
      - name: Test external consumers
        working-directory: test/bcr
        run: bazel test --test_output=errors //...
      - name: Check shared exports and OpenSSL linkage
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 tools/bazel_exports.py bazel-bin/libcnats.a bazel-bin/libcnats.${{ runner.os == 'macOS' && 'dylib' || 'so' }}
          if [[ "$RUNNER_OS" == Linux ]]; then
            dependencies=$(readelf -d bazel-bin/libcnats.so)
          else
            dependencies=$(otool -L bazel-bin/libcnats.dylib)
          fi
          if grep -Eq 'lib(ssl|crypto)[.0-9]*\.(so|dylib)' <<< "$dependencies"; then
            echo 'Unexpected OpenSSL shared-library dependency'
            exit 1
          fi

  integration:
    name: Integration / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15-intel, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ runner.os }}-${{ runner.arch }}-integration
          repository-cache: true
      - name: Run server integration tests
        run: bazel test --test_output=errors //test:integration
      - name: Collect test results
        if: failure()
        shell: bash
        run: |
          mkdir -p integration-results
          testlogs=$(bazel info bazel-testlogs | tr -d '\r')
          for result in "$testlogs"/test/integration_*; do
            if [[ -d "$result" ]]; then
              cp -R "$result" integration-results/
            fi
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: integration-${{ matrix.os }}
          path: integration-results
